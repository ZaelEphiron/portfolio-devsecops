name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FastAPI app dependencies
        working-directory: projects/fastapi-app
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Basic FastAPI startup check
        working-directory: projects/fastapi-app
        run: |
          python -c "import uvicorn; print('FastAPI OK')"
      
      - name: Installation des dépendances
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lancement des tests
        run: |
          if [ -d tests ]; then pytest -q; fi

      - name: Scan SAST - Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/ci"

      - name: Scan de secrets - Gitleaks
        uses: gitleaks/gitleaks-action@v2

      - name: Scan des dépendances - Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true

  docker-build-and-scan:
    runs-on: ubuntu-latest
    needs: build-test-security

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build Docker image for FastAPI app
        run: |
          docker build \
          -t ghcr.io/${{ github.repository_owner }}/portfolio-devsecops:latest \
          projects/fastapi-app

      - name: Scan de l'image Docker avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/portfolio-devsecops:latest
          format: table
          exit-code: 0
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  docker-push-ghcr:
    runs-on: ubuntu-latest
    needs: docker-build-and-scan

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push de l'image FastAPI vers GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/portfolio-devsecops:latest
