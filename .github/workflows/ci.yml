name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-test-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lancement des tests
        run: |
          if [ -d tests ]; then pytest -q; fi

      - name: Scan SAST - Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/ci"

      - name: Scan de secrets - Gitleaks
        uses: gitleaks/gitleaks-action@v2

      - name: Scan des dépendances - Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true

  docker-build-and-scan:
    runs-on: ubuntu-latest
    needs: build-test-security

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Construction de l'image Docker
        run: |
          docker build -t pipeline-ci-cd-image ./projects/pipeline-ci-cd

      - name: Scan de l'image Docker avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pipeline-ci-cd-image
          format: table
          exit-code: 0
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

